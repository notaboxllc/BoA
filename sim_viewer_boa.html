<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BoxOfActin Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 48px;
      left: 12px;
      color: #fff;
      font: 13px/1.8 monospace;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000;
      z-index: 10;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f88;
      font: 14px/2 monospace;
      text-align: center;
      display: none;
      z-index: 10;
    }

    /* ── directory bar ─────────────────────────────────────────────────────── */
    #dirBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      z-index: 10;
    }

    #dirBar .label {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #dirInput {
      flex: 1;
      min-width: 0;
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 8px;
      font: 13px monospace;
      outline: none;
    }
    #dirInput:focus { border-color: #4a7aaa; color: #fff; }

    #recentSel {
      background: #2a2a2a;
      color: #777;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 2px 4px;
      font: 12px monospace;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    #recentSel:hover { color: #ccc; }
    #recentSel option { background: #1a1a1a; color: #ccc; }

    #dirBar button {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 11px;
      cursor: pointer;
      font: 13px monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #dirBar button:hover { background: #3a3a3a; color: #fff; }

    /* ── bottom control bar ────────────────────────────────────────────────── */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 10;
    }

    #controls button {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 11px;
      cursor: pointer;
      font: 13px monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #controls button:hover  { background: #3a3a3a; color: #fff; }
    #controls button.active { background: #1a3a5a; border-color: #4a7aaa; color: #adf; }

    #slider {
      flex: 1;
      min-width: 0;
      accent-color: #4a7aaa;
      cursor: pointer;
      height: 4px;
    }

    #frameCounter {
      color: #ccc;
      white-space: nowrap;
      min-width: 130px;
      text-align: center;
      font-size: 12px;
    }

    .sep {
      color: #444;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ── nav hint ──────────────────────────────────────────────────────────── */
    #navHint {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      color: #555;
      font: 11px monospace;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    /* ── live mode bar ─────────────────────────────────────────────────────── */
    #liveBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      z-index: 10;
      color: #ccc;
      font: 13px monospace;
    }
    #liveDot { font-size: 18px; line-height: 1; }
    .liveCtrlSep { width: 1px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 4px; flex-shrink: 0; }
    .liveBtn {
      background: rgba(255,255,255,0.08);
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 10px;
      cursor: pointer;
      font: 12px monospace;
      white-space: nowrap;
    }
    .liveBtn:hover:not(:disabled) { color: #fff; border-color: #aaa; }
    .liveBtn:disabled { opacity: 0.35; cursor: default; }
    #btnKill { border-color: #833; color: #f88; }
    #btnKill:hover:not(:disabled) { border-color: #f44; color: #faa; }

    /* ── display panel ─────────────────────────────────────────────────────── */
    #displayToggle {
      position: absolute;
      top: 44px;
      right: 12px;
      background: rgba(0,0,0,0.75);
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 10px;
      cursor: pointer;
      font: 12px monospace;
      z-index: 10;
      white-space: nowrap;
    }
    #displayToggle:hover { color: #fff; }

    #displayPanel {
      position: absolute;
      top: 72px;
      right: 12px;
      background: rgba(0,0,0,0.82);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 14px;
      z-index: 10;
      display: none;
      font: 12px/2.2 monospace;
      color: #ccc;
      min-width: 250px;
    }
    #displayPanel.open { display: block; }
    #displayPanel label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #displayPanel .pLabel {
      width: 116px;
      flex-shrink: 0;
      color: #aaa;
    }
    #displayPanel input[type=range] {
      flex: 1;
      accent-color: #4a7aaa;
      height: 4px;
      cursor: pointer;
    }
    #displayPanel .pVal {
      width: 36px;
      text-align: right;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── param panel (C4) ─────────────────────────────────────────────────── */
    #paramPanel {
      position: absolute;
      top: 44px;
      left: 12px;
      background: rgba(0,0,0,0.87);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 14px;
      z-index: 15;
      display: none;
      font: 12px/1.9 monospace;
      color: #ccc;
      min-width: 340px;
      max-width: 440px;
      max-height: 60vh;
      overflow-y: auto;
    }
    #paramPanel.open { display: block; }
    #paramPanel h3 {
      font-size: 12px;
      color: #aaa;
      margin: 0 0 6px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
    .pp-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }
    .pp-name {
      flex: 1;
      min-width: 0;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pp-input {
      width: 80px;
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 2px 5px;
      font: 12px monospace;
      outline: none;
      flex-shrink: 0;
    }
    .pp-input:focus { border-color: #4a7aaa; color: #fff; }
    .pp-apply {
      background: rgba(255,255,255,0.08);
      color: #ccc;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 8px;
      cursor: pointer;
      font: 11px monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pp-apply:hover { color: #fff; border-color: #aaa; }
    .pp-msg {
      font-size: 11px;
      min-width: 60px;
      flex-shrink: 0;
      text-align: right;
    }

    /* ── inspect panel (C2) ────────────────────────────────────────────────── */
    #inspectPanel {
      position: absolute;
      bottom: 60px;
      left: 12px;
      background: rgba(0,0,0,0.87);
      border: 1px solid #555;
      border-radius: 4px;
      padding: 10px 14px;
      z-index: 20;
      display: none;
      font: 12px/1.7 monospace;
      color: #ccc;
      min-width: 280px;
      max-width: 420px;
      max-height: 50vh;
      overflow-y: auto;
    }
    #inspectPanel.open { display: block; }
    #inspectPanel .ip-title {
      font-size: 13px;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #inspectPanel .ip-close {
      cursor: pointer;
      color: #666;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    #inspectPanel .ip-close:hover { color: #fff; }
    #inspectPanel table { width: 100%; border-collapse: collapse; }
    #inspectPanel td { padding: 1px 4px; vertical-align: top; }
    #inspectPanel td:first-child { color: #888; min-width: 140px; }
    #inspectPanel td:last-child  { color: #eee; word-break: break-all; }

    /* ── benchmark HUD (Increment 1) ──────────────────────────────────────── */
    #benchmarkHud {
      position: absolute;
      top: 78px;
      right: 12px;
      background: rgba(0,0,0,0.70);
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 10px;
      z-index: 10;
      display: none;
      font: 12px/1.9 monospace;
      color: #ddd;
      text-align: right;
      min-width: 210px;
      pointer-events: none;
    }
    #benchmarkHud.active { display: block; pointer-events: auto; }
    #benchmarkHud .bm-title { color: #aaa; border-bottom: 1px solid #444; margin-bottom: 3px; padding-bottom: 2px; }
    #benchmarkHud .bm-chain { color: #aaa; line-height: 1.7; }
    #benchmarkHud .bm-divider { border-top: 1px solid #444; margin: 4px 0; }
    #benchmarkHud .bm-relax { color: #fa0; margin-top: 3px; }
    #btnBenchForce {
      display: block;
      width: 100%;
      margin-top: 5px;
      pointer-events: auto;
    }
    #btnBenchForce.force-off { border-color: #833; color: #f88; }
    #btnBenchForce.force-off:hover:not(:disabled) { border-color: #f44; color: #faa; }
  </style>
</head>
<body>

<div id="hud">loading…</div>
<div id="error"></div>

<div id="dirBar">
  <span class="label">Dir:</span>
  <input id="dirInput" type="text" value="." spellcheck="false" autocomplete="off">
  <select id="recentSel" title="Recent directories">
    <option value="">Recent ▾</option>
  </select>
  <button id="btnLoad">Load</button>
</div>

<div id="liveBar">
  <span id="liveDot" style="color:#fa0">●</span>
  <span id="liveStatusText">LIVE — connecting…</span>
  <div class="liveCtrlSep"></div>
  <button id="btnPause"  class="liveBtn" disabled>⏸ Pause</button>
  <button id="btnResume" class="liveBtn" disabled>▶ Resume</button>
  <button id="btnKill"   class="liveBtn" disabled>✕ Kill</button>
  <div class="liveCtrlSep"></div>
  <button id="btnParams" class="liveBtn">Params ▶</button>
</div>

<div id="paramPanel">
  <h3>Mutable parameters</h3>
  <div id="paramRows"></div>
</div>

<div id="benchmarkHud">
  <div class="bm-title">— Benchmark —</div>
  <div id="bmChainInfo"></div>
  <div class="bm-divider"></div>
  <div id="bmHudRows"></div>
  <div id="bmTauMeasRow" class="bm-relax" style="display:none"></div>
  <div id="bmTauTheoRow" class="bm-relax" style="display:none"></div>
  <button id="btnBenchForce" class="liveBtn">Force: ON</button>
</div>

<div id="controls">
  <button id="btnPlay">&#9654; Play</button>
  <div class="sep">|</div>
  <input  id="slider" type="range" min="0" max="0" value="0">
  <span   id="frameCounter">— of —</span>
  <div class="sep">|</div>
  <button id="btn2fps">2 fps</button>
  <button id="btn10fps">10 fps</button>
  <button id="btn30fps">30 fps</button>
</div>

<div id="navHint">Drag: rotate &nbsp;|&nbsp; Shift+drag: pan &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Click: inspect</div>
<button id="displayToggle">Display ▶</button>
<div id="displayPanel">
  <label><span class="pLabel">Actin radius</span>    <input id="sActin"    type="range" min="0.1" max="8" step="0.1" value="1"><span class="pVal" id="vActin">1.00</span></label>
  <label><span class="pLabel">Minifil radius</span>  <input id="sMinifil"  type="range" min="0.1" max="8" step="0.1" value="1"><span class="pVal" id="vMinifil">1.00</span></label>
  <label><span class="pLabel">Motor head</span>      <input id="sMotor"    type="range" min="0.1" max="8" step="0.1" value="1"><span class="pVal" id="vMotor">1.00</span></label>
  <label><span class="pLabel">Lever arm</span>       <input id="sLever"    type="range" min="0.1" max="8" step="0.1" value="1"><span class="pVal" id="vLever">1.00</span></label>
  <label><span class="pLabel">Myo rod</span>        <input id="sRod"      type="range" min="0.1" max="8" step="0.1" value="1"><span class="pVal" id="vRod">1.00</span></label>
  <label><span class="pLabel">Segment axes</span>    <input id="chkAxes"   type="checkbox"></label>
</div>

<div id="inspectPanel">
  <div class="ip-title">
    <span id="inspectKind">—</span>
    <span class="ip-close" id="inspectClose">✕</span>
  </div>
  <table id="inspectTable"></table>
</div>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── live WebSocket mode: ?live=<port> activates live streaming ────────────────
const _liveParam = new URL(location.href).searchParams.get('live');
const LIVE_MODE  = _liveParam !== null && _liveParam !== '';
const LIVE_PORT  = LIVE_MODE ? (parseInt(_liveParam, 10) || 0) : 0;

// module-level WebSocket ref — used by click-to-inspect handler (C2)
let ws = null;

// ── renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── scene / camera ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.0001, 1000);
camera.position.set(0, 0, 15);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.08;
orbitControls.minDistance = 0.01;
orbitControls.maxDistance = 500;
orbitControls.zoomSpeed = 2.0;
orbitControls.mouseButtons = {
  LEFT:   THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT:  THREE.MOUSE.PAN
};
orbitControls.touches = {
  ONE: THREE.TOUCH.ROTATE,
  TWO: THREE.TOUCH.DOLLY_PAN
};

// ── lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(2, 3, 4);
scene.add(sun);

// ── instanced segment mesh ────────────────────────────────────────────────────
// Unit cylinder along Y: radius 1, height 1. Scaled per-instance to (r, length, r).
const MAX_SEGMENTS = 50000;
const MAX_MYOSINS       = 5000;
const MAX_MINIFILAMENTS = 2000;
const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1);
const segMesh = new THREE.InstancedMesh(cylGeo,
  new THREE.MeshPhongMaterial({ color: 0xcc44bb }), MAX_SEGMENTS);
segMesh.count = 0;
segMesh.frustumCulled = false;
scene.add(segMesh);

const rodMesh = new THREE.InstancedMesh(cylGeo,
  new THREE.MeshPhongMaterial({ color: 0x888888 }), MAX_MYOSINS);
rodMesh.count = 0;
rodMesh.frustumCulled = false;
scene.add(rodMesh);

const leverMesh = new THREE.InstancedMesh(cylGeo,
  new THREE.MeshPhongMaterial({ color: 0x88ccff }), MAX_MYOSINS);
leverMesh.count = 0;
leverMesh.frustumCulled = false;
scene.add(leverMesh);

const sphGeo = new THREE.SphereGeometry(1, 8, 6);
const motorMesh = new THREE.InstancedMesh(sphGeo,
  new THREE.MeshPhongMaterial({}), MAX_MYOSINS);
motorMesh.count = 0;
motorMesh.frustumCulled = false;
scene.add(motorMesh);
motorMesh.instanceColor = new THREE.InstancedBufferAttribute(
  new Float32Array(MAX_MYOSINS * 3), 3);

const minifilMesh = new THREE.InstancedMesh(cylGeo,
  new THREE.MeshPhongMaterial({ color: 0xffffff }), MAX_MINIFILAMENTS);
minifilMesh.count = 0;
minifilMesh.frustumCulled = false;
scene.add(minifilMesh);

const motorColors = {
  'NONE':  new THREE.Color(0x4444ff),
  'ATP':   new THREE.Color(0xffff00),
  'ADPPi': new THREE.Color(0xff9900),
  'ADP':   new THREE.Color(0xff0000),
};

// ── per-segment local axis lines (benchmark mode) ─────────────────────────────
// Three LineSegments objects (X=red, Y=green, Z=blue) rebuilt each frame when
// axis data is present. axisLines[i] is null until first benchmark frame arrives.
const axisLineMats = [
  new THREE.LineBasicMaterial({ color: 0xff5555 }), // X axis — red
  new THREE.LineBasicMaterial({ color: 0x55ff55 }), // Y axis — green
  new THREE.LineBasicMaterial({ color: 0x5555ff }), // Z axis — blue
];
let axisLines = [null, null, null]; // THREE.LineSegments, one per axis color
let showAxes = false;               // toggled by #chkAxes; enabled on first benchmark frame

// ── identity maps — rebuilt each frame from JSON "id" fields ──────────────────
// Forward (id → slot): lets future code find the render slot for a given stable ID.
// Reverse (slot → id): lets a raycast hit (instanceId) resolve to a stable ID.
// The reverse maps are the picking attachment point for future WebSocket click-to-inspect.
// Segments: keyed by FilSegment.thingInstanceId
const segIdToSlot  = new Map();
const segSlotToId  = new Map();
// Myosins: keyed by MyoRod.thingInstanceId (canonical ID for the rod/lever/motor composite;
//   Myosin is not a Thing subclass, so its rod's stable ID is used as the group key).
const myoIdToSlot  = new Map();  // lever+motor slot (lever is never invisible)
const myoSlotToId  = new Map();  // reverse for lever/motor mesh picking
const rodIdToSlot  = new Map();  // rod slot (separate: rod can be invisible)
const rodSlotToId  = new Map();  // reverse for rod mesh picking
// Minifilaments: keyed by MyoMiniFilament.thingInstanceId
const miniIdToSlot = new Map();
const miniSlotToId = new Map();

// ── raycaster for click-to-inspect (C2) ──────────────────────────────────────
const raycaster = new THREE.Raycaster();
const _mouse    = new THREE.Vector2();
let   _ptrDown  = null;

// ── reusable temporaries for per-frame matrix construction ────────────────────
const dummy  = new THREE.Object3D();
const _end1  = new THREE.Vector3();
const _end2  = new THREE.Vector3();
const _dir   = new THREE.Vector3();
const _yAxis = new THREE.Vector3(0, 1, 0);

function setCylinderMatrix(end1, end2, r, minLength = 0) {
  _end1.set(end1[0], end1[1], end1[2]);
  _end2.set(end2[0], end2[1], end2[2]);
  _dir.subVectors(_end2, _end1);
  const len = Math.max(_dir.length(), minLength);
  if (len < 1e-10) return false;
  _dir.normalize();
  dummy.position.addVectors(_end1, _end2).multiplyScalar(0.5);
  dummy.quaternion.setFromUnitVectors(_yAxis, _dir);
  dummy.scale.set(r, len, r);
  dummy.updateMatrix();
  return true;
}

// ── DOM refs ──────────────────────────────────────────────────────────────────
const hud          = document.getElementById('hud');
const errorDiv     = document.getElementById('error');
const dirInput     = document.getElementById('dirInput');
const recentSel    = document.getElementById('recentSel');
const btnLoad      = document.getElementById('btnLoad');
const btnPlay      = document.getElementById('btnPlay');
const slider       = document.getElementById('slider');
const frameCounter = document.getElementById('frameCounter');
const speedBtns    = {
  2:  document.getElementById('btn2fps'),
  10: document.getElementById('btn10fps'),
  30: document.getElementById('btn30fps'),
};

// ── live mode: hide file controls, show live bar ──────────────────────────────
if (LIVE_MODE) {
  document.getElementById('dirBar').style.display   = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('liveBar').style.display  = 'flex';
}

// ── display scale factors (updated by panel sliders) ─────────────────────────
let actinScale   = 1.0;
let minifilScale = 1.0;
let motorScale   = 1.0;
let leverScale   = 1.0;
let rodScale     = 1.0;

// ── playback state ────────────────────────────────────────────────────────────
let simDir        = '.';
let totalFrames   = 0;
let currentFrame  = 0;
let isPlaying     = false;
let playbackFps   = 2;
let lastAdvanceMs = 0;
let loading          = false;
let boundsObj        = null;
let apiPopulated     = false;
let currentFrameData = null;
const recentDirs     = [];

// ── helpers ───────────────────────────────────────────────────────────────────
function normalizeDir(d) {
  d = (d || '').trim();
  return d.replace(/\/+$/, '') || '.';
}

function frameUrl(n) {
  const name = 'frame_' + String(n).padStart(6, '0') + '.json';
  return simDir === '.' ? name : simDir + '/' + name;
}

function updateUI() {
  slider.max   = Math.max(0, totalFrames - 1);
  slider.value = currentFrame;
  frameCounter.textContent = totalFrames > 0
    ? `frame ${currentFrame} of ${totalFrames - 1}`
    : '— of —';
}

function setSpeed(fps) {
  playbackFps = fps;
  Object.entries(speedBtns).forEach(([f, btn]) =>
    btn.classList.toggle('active', Number(f) === fps));
}

function setPlaying(state) {
  isPlaying = state;
  btnPlay.innerHTML = isPlaying ? '&#9646;&#9646; Pause' : '&#9654; Play';
}

function togglePlay() {
  if (totalFrames === 0) return;
  setPlaying(!isPlaying);
}

// ── recent directories ────────────────────────────────────────────────────────
function addToRecent(dir) {
  if (apiPopulated) return;
  const i = recentDirs.indexOf(dir);
  if (i !== -1) recentDirs.splice(i, 1);
  recentDirs.unshift(dir);
  if (recentDirs.length > 5) recentDirs.pop();
  while (recentSel.options.length > 1) recentSel.remove(1);
  recentDirs.forEach(d => recentSel.add(new Option(d, d)));
  recentSel.selectedIndex = 0;
}

// ── directory loading ─────────────────────────────────────────────────────────
function loadDirectory(dir) {
  dir = normalizeDir(dir);
  simDir = dir;
  dirInput.value = dir;

  const label = dir === '.' ? 'current dir' : (dir.split('/').pop() || dir);
  document.title = 'BoxOfActin — ' + label;

  addToRecent(dir);

  if (boundsObj) {
    scene.remove(boundsObj);
    boundsObj.geometry.dispose();
    boundsObj = null;
  }
  segMesh.count = 0;
  segMesh.instanceMatrix.needsUpdate = true;
  rodMesh.count = 0;
  rodMesh.instanceMatrix.needsUpdate = true;
  leverMesh.count = 0;
  leverMesh.instanceMatrix.needsUpdate = true;
  motorMesh.count = 0;
  motorMesh.instanceMatrix.needsUpdate = true;
  minifilMesh.count = 0;
  minifilMesh.instanceMatrix.needsUpdate = true;

  totalFrames  = 0;
  currentFrame = 0;
  loading      = false;
  setPlaying(false);
  updateUI();

  hud.innerHTML = 'loading…';
  errorDiv.style.display = 'none';

  discoverFrames();
}

// ── frame loading ─────────────────────────────────────────────────────────────
function applyFrameData(data) {
  // Build box wireframe from first frame; absent in benchmark mode.
  if (!boundsObj && data.bounds) {
    const { xDim, yDim, zDim } = data.bounds;
    const boxGeo   = new THREE.BoxGeometry(xDim, yDim, zDim);
    const edgesGeo = new THREE.EdgesGeometry(boxGeo);
    boxGeo.dispose();
    boundsObj = new THREE.LineSegments(edgesGeo,
      new THREE.LineBasicMaterial({ color: 0x336633 }));
    scene.add(boundsObj);
  }

  // Segments — identity-keyed; maps rebuilt from scratch each frame
  segIdToSlot.clear();
  segSlotToId.clear();
  let count = 0;
  for (const seg of data.segments) {
    if (count >= MAX_SEGMENTS) break;
    if (!setCylinderMatrix(seg.end1, seg.end2, seg.r * actinScale)) continue;
    segMesh.setMatrixAt(count, dummy.matrix);
    segIdToSlot.set(seg.id, count);
    segSlotToId.set(count, seg.id);
    count++;
  }
  segMesh.count = count;
  segMesh.instanceMatrix.needsUpdate = true;

  updateMyosinData(data.myosins, data.minifilaments);
  updateAxisLines(data.segments);

  hud.innerHTML =
    `frame ${data.frame}<br>` +
    `t = ${data.t.toFixed(5)} s<br>` +
    `segments: ${count}` +
    (data.myosins      ? `<br>myosins: ${data.myosins.length}`           : '') +
    (data.minifilaments ? `<br>minifilaments: ${data.minifilaments.length}` : '');
}

function updateAxisLines(segments) {
  // Only draw axes when the payload carries axis data and the toggle is on.
  if (!showAxes || !segments || !segments.length || !segments[0].axisX) {
    for (let a = 0; a < 3; a++) {
      if (axisLines[a]) axisLines[a].visible = false;
    }
    return;
  }

  const axes = ['axisX', 'axisY', 'axisZ'];
  for (let a = 0; a < 3; a++) {
    const pts = [];
    for (const seg of segments) {
      if (!seg.axisX) continue;
      // Centroid = midpoint of end1/end2
      const cx = (seg.end1[0] + seg.end2[0]) / 2;
      const cy = (seg.end1[1] + seg.end2[1]) / 2;
      const cz = (seg.end1[2] + seg.end2[2]) / 2;
      // Half-length of the axis indicator: 0.3 × half-segment-length
      const dx = seg.end2[0] - seg.end1[0];
      const dy = seg.end2[1] - seg.end1[1];
      const dz = seg.end2[2] - seg.end1[2];
      const halfLen = 0.3 * Math.sqrt(dx*dx + dy*dy + dz*dz) / 2;
      const av = seg[axes[a]];
      pts.push(cx - av[0]*halfLen, cy - av[1]*halfLen, cz - av[2]*halfLen,
               cx + av[0]*halfLen, cy + av[1]*halfLen, cz + av[2]*halfLen);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    if (axisLines[a]) {
      axisLines[a].geometry.dispose();
      axisLines[a].geometry = geo;
      axisLines[a].visible = true;
    } else {
      axisLines[a] = new THREE.LineSegments(geo, axisLineMats[a]);
      axisLines[a].frustumCulled = false;
      scene.add(axisLines[a]);
    }
  }
}

function updateMyosinData(myosins, minifilaments) {
  // Myosins — identity-keyed by m.id (= MyoRod.thingInstanceId, the composite's stable key).
  // Rod, lever, motor have separate slot counters because rod can be invisible.
  // myoIdToSlot/myoSlotToId track the lever slot; motor uses the same slot (lever is never skipped).
  // rodIdToSlot/rodSlotToId are separate for picking on the rod mesh.
  myoIdToSlot.clear();
  myoSlotToId.clear();
  rodIdToSlot.clear();
  rodSlotToId.clear();
  let rodCt = 0, leverCt = 0, motorCt = 0;

  if (myosins) {
    for (const m of myosins) {
      // Rod (may be invisible)
      if (!m.rod.invisible && rodCt < MAX_MYOSINS &&
          setCylinderMatrix(m.rod.end1, m.rod.end2, m.rod.r * rodScale)) {
        rodMesh.setMatrixAt(rodCt, dummy.matrix);
        rodIdToSlot.set(m.id, rodCt);
        rodSlotToId.set(rodCt, m.id);
        rodCt++;
      }
      // Lever (canonical myosin slot; motor always rendered in the same slot)
      if (leverCt < MAX_MYOSINS &&
          setCylinderMatrix(m.lever.end1, m.lever.end2, m.lever.r * leverScale, m.lever.r * leverScale * 2)) {
        leverMesh.setMatrixAt(leverCt, dummy.matrix);
        myoIdToSlot.set(m.id, leverCt);
        myoSlotToId.set(leverCt, m.id);  // also valid for motorMesh (same slot index)
        leverCt++;
      }
      // Motor
      if (motorCt < MAX_MYOSINS) {
        const mo = m.motor;
        _end1.set(mo.end1[0], mo.end1[1], mo.end1[2]);
        _end2.set(mo.end2[0], mo.end2[1], mo.end2[2]);
        _dir.subVectors(_end2, _end1);
        const len = _dir.length();
        dummy.position.addVectors(_end1, _end2).multiplyScalar(0.5);
        const r = mo.r * motorScale;
        if (len > 1e-10) {
          _dir.normalize();
          dummy.quaternion.setFromUnitVectors(_yAxis, _dir);
          dummy.scale.set(r, r * 1.5, r);
        } else {
          dummy.quaternion.identity();
          dummy.scale.set(r, r, r);
        }
        dummy.updateMatrix();
        motorMesh.setMatrixAt(motorCt, dummy.matrix);
        motorMesh.setColorAt(motorCt, motorColors[mo.state] || motorColors['NONE']);
        motorCt++;
      }
    }
  }

  // Minifilaments — identity-keyed by mf.id (= MyoMiniFilament.thingInstanceId)
  miniIdToSlot.clear();
  miniSlotToId.clear();
  let minifilCt = 0;
  if (minifilaments) {
    for (const mf of minifilaments) {
      if (minifilCt >= MAX_MINIFILAMENTS) break;
      if (!setCylinderMatrix(mf.end1, mf.end2, mf.r * minifilScale)) continue;
      minifilMesh.setMatrixAt(minifilCt, dummy.matrix);
      miniIdToSlot.set(mf.id, minifilCt);
      miniSlotToId.set(minifilCt, mf.id);
      minifilCt++;
    }
  }

  rodMesh.count = rodCt;
  leverMesh.count = leverCt;
  motorMesh.count = motorCt;
  minifilMesh.count = minifilCt;
  rodMesh.instanceMatrix.needsUpdate = true;
  leverMesh.instanceMatrix.needsUpdate = true;
  motorMesh.instanceMatrix.needsUpdate = true;
  minifilMesh.instanceMatrix.needsUpdate = true;
  if (motorMesh.instanceColor) motorMesh.instanceColor.needsUpdate = true;
}

function loadFrame(n) {
  if (loading) return;
  loading = true;
  fetch(frameUrl(n))
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => { currentFrameData = data; applyFrameData(data); loading = false; })
    .catch(() => { loading = false; });
}

function goToFrame(n) {
  if (totalFrames === 0) return;
  currentFrame = ((n % totalFrames) + totalFrames) % totalFrames;
  updateUI();
  loadFrame(currentFrame);
}

// ── auto-discover total frame count ──────────────────────────────────────────
async function discoverFrames() {
  try {
    const first = await fetch(frameUrl(0), { method: 'HEAD' });
    if (!first.ok) { showError(`No frames found in "${simDir}".`); return; }
  } catch (e) {
    showError(`Cannot reach server: ${e.message}`);
    return;
  }

  let n = 1;
  while (true) {
    try {
      const r = await fetch(frameUrl(n), { method: 'HEAD' });
      if (!r.ok) break;
      n++;
    } catch (_) { break; }
  }

  totalFrames = n;
  updateUI();
  loadFrame(0);
}

function showError(msg) {
  hud.innerHTML = '';
  errorDiv.style.display = 'block';
  errorDiv.innerHTML = msg +
    '<br><br>Serve this directory with:<br>' +
    '<code>python3 sim_server.py</code><br>' +
    'then open <code>http://localhost:8000/sim_viewer_boa.html</code>';
}

// ── inspect panel (C2) ────────────────────────────────────────────────────────
const inspectPanel = document.getElementById('inspectPanel');
const inspectKind  = document.getElementById('inspectKind');
const inspectTable = document.getElementById('inspectTable');
document.getElementById('inspectClose').addEventListener('click', () =>
  inspectPanel.classList.remove('open'));

function fmt3(v) {
  if (v === null || v === undefined) return 'null';
  if (Array.isArray(v))
    return '[' + v.map(n => (typeof n === 'number' ? n.toFixed(5) : String(n))).join(', ') + ']';
  if (typeof v === 'object')
    return '(' + Object.entries(v).map(([k, n]) => k + ':' + (typeof n === 'number' ? n.toFixed(5) : String(n))).join(', ') + ')';
  return String(v);
}

function showInspectPanel(data) {
  if (data.kind === 'notFound') {
    inspectKind.textContent = '(object no longer exists)';
    inspectTable.innerHTML = '<tr><td colspan="2" style="color:#777;text-align:center">' +
      'destroyed between click and processing</td></tr>';
    inspectPanel.classList.add('open');
    return;
  }
  if (data.kind === 'unknown') {
    inspectKind.textContent = '(unknown object type)';
    inspectTable.innerHTML = '';
    inspectPanel.classList.add('open');
    return;
  }
  inspectKind.textContent = data.kind + '  id=' + data.id;
  const rows = [];
  for (const [k, v] of Object.entries(data)) {
    if (k === 'kind' || k === 'id') continue;
    let val;
    if (v === null)                 val = 'null';
    else if (Array.isArray(v))      val = '[' + v.join(', ') + ']';
    else if (typeof v === 'object') val = fmt3(v);
    else if (typeof v === 'number' && !Number.isInteger(v)) val = v.toFixed(5);
    else                            val = String(v);
    rows.push('<tr><td>' + k + '</td><td>' + val + '</td></tr>');
  }
  inspectTable.innerHTML = rows.join('');
  inspectPanel.classList.add('open');
}

// ── click-to-inspect: pointer handlers (C2) ──────────────────────────────────
renderer.domElement.addEventListener('pointerdown', (e) => {
  _ptrDown = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!_ptrDown) return;
  const dx = e.clientX - _ptrDown.x;
  const dy = e.clientY - _ptrDown.y;
  _ptrDown = null;
  if (Math.abs(dx) + Math.abs(dy) > 5) return;  // drag, not click
  _mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  _mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(_mouse, camera);
  const hits = raycaster.intersectObjects(
    [segMesh, rodMesh, leverMesh, motorMesh, minifilMesh], false);
  if (hits.length === 0) return;  // empty-space click — leave panel as-is
  const hit = hits[0];
  let thingId;
  if      (hit.object === segMesh)                           thingId = segSlotToId.get(hit.instanceId);
  else if (hit.object === rodMesh)                           thingId = rodSlotToId.get(hit.instanceId);
  else if (hit.object === leverMesh || hit.object === motorMesh) thingId = myoSlotToId.get(hit.instanceId);
  else if (hit.object === minifilMesh)                       thingId = miniSlotToId.get(hit.instanceId);
  if (thingId == null) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'inspect', id: thingId }));
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { inspectPanel.classList.remove('open'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
    e.preventDefault();
    dirInput.focus();
    dirInput.select();
    return;
  }
  if (e.target === slider || e.target === dirInput) return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      e.preventDefault();
      setPlaying(false);
      goToFrame(currentFrame + 1);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      setPlaying(false);
      goToFrame(currentFrame - 1);
      break;
  }
});

  if (isPlaying && totalFrames > 0 && !loading) {

      goToFrame(currentFrame + 1);

  renderer.render(scene, camera);
}

// ── WebSocket live streaming (LIVE_MODE only) ─────────────────────────────────
if (LIVE_MODE) {
  const liveDot  = document.getElementById('liveDot');
  const liveText = document.getElementById('liveStatusText');
  const btnPause  = document.getElementById('btnPause');
  const btnResume = document.getElementById('btnResume');
  const btnKill   = document.getElementById('btnKill');
  let wsBackoff   = 1000;
  let terminated  = false;  // true after server sends 'terminating'; suppresses reconnect

  function setLiveState(label) {
    if (label === 'connected') {
      liveDot.style.color = '#4f4';
      liveText.textContent = `LIVE ws://localhost:${LIVE_PORT} — connected`;
    } else if (label === 'connected-paused') {
      liveDot.style.color = '#ff0';
      liveText.textContent = `LIVE ws://localhost:${LIVE_PORT} — Connected — Paused`;
    } else if (label === 'terminating') {
      liveDot.style.color = '#f84';
      liveText.textContent = `LIVE ws://localhost:${LIVE_PORT} — Simulation ending…`;
    } else if (label === 'reconnecting') {
      liveDot.style.color = '#fa0';
      liveText.textContent = `LIVE ws://localhost:${LIVE_PORT} — reconnecting in ${wsBackoff / 1000}s…`;
    } else {
      liveDot.style.color = '#f44';
      liveText.textContent = `LIVE ws://localhost:${LIVE_PORT} — disconnected`;
    }
  }

  function setCtrlsForSimState(state) {
    if (state === 'running') {
      btnPause.disabled  = false;
      btnResume.disabled = true;
      btnKill.disabled   = false;
    } else if (state === 'paused') {
      btnPause.disabled  = true;
      btnResume.disabled = false;
      btnKill.disabled   = false;
    } else {
      // terminating or unknown — disable all
      btnPause.disabled  = true;
      btnResume.disabled = true;
      btnKill.disabled   = true;
    }
  }

  function scheduleReconnect() {
    if (terminated) { setLiveState('disconnected'); return; }
    setLiveState('reconnecting');
    setTimeout(() => {
      wsBackoff = Math.min(wsBackoff * 2, 8000);
      openSocket();
    }, wsBackoff);
  }

  function openSocket() {
    try {
      ws = new WebSocket(`ws://localhost:${LIVE_PORT}`);
    } catch (_) {
      scheduleReconnect();
      return;
    }
    ws.onopen = () => {
      wsBackoff = 1000;
      ws.send(JSON.stringify({ action: 'subscribe', topics: ['frame', 'inspectResult', 'simState', 'paramAck', 'paramList'] }));
      ws.send(JSON.stringify({ action: 'queryParams' }));
      setLiveState('connected');
    };
    ws.onmessage = (ev) => {
      let env;
      try { env = JSON.parse(ev.data); } catch (_) { return; }
      if (env.topic === 'frame') {
        currentFrameData = env.payload;
        applyFrameData(env.payload);
      } else if (env.topic === 'inspectResult') {
        showInspectPanel(env.payload);
      } else if (env.topic === 'simState') {
        const state = env.payload.state;
        setCtrlsForSimState(state);
        if (state === 'paused') {
          setLiveState('connected-paused');
        } else if (state === 'terminating') {
          terminated = true;
          setLiveState('terminating');
        } else {
          setLiveState('connected');
        }
      } else if (env.topic === 'paramList') {
        buildParamPanel(env.payload);
      } else if (env.topic === 'paramAck') {
        handleParamAck(env.payload);
      } else if (env.topic === 'benchmark') {
        updateBenchmarkHud(env.payload);
      }
    };
    ws.onclose = () => {
      ws = null;
      setCtrlsForSimState('unknown');
      scheduleReconnect();
    };
    ws.onerror = () => { /* onclose fires after onerror */ };
  }

  btnPause.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'pause' }));
  });
  btnResume.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'resume' }));
  });
  btnKill.addEventListener('click', () => {
    if (!confirm('Kill the running simulation? This cannot be undone.')) return;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'kill' }));
  });

  // ── C4: parameter panel ───────────────────────────────────────────────────
  const btnParams  = document.getElementById('btnParams');
  const paramPanel = document.getElementById('paramPanel');
  const paramRows  = document.getElementById('paramRows');

  btnParams.addEventListener('click', () => {
    const open = paramPanel.classList.toggle('open');
    btnParams.textContent = open ? 'Params ▼' : 'Params ▶';
    // refresh on open
    if (open && ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ action: 'queryParams' }));
  });

  // Periodic refresh of param values (~5s) while panel is open
  setInterval(() => {
    if (paramPanel.classList.contains('open') && ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ action: 'queryParams' }));
  }, 5000);

  function buildParamPanel(params) {
    // Keep input values that the user has typed (don't clobber pending edits)
    const pending = new Map();
    paramRows.querySelectorAll('.pp-input').forEach(inp => {
      pending.set(inp.dataset.name, inp.value);
    });

    paramRows.innerHTML = '';
    const mutableParams = params.filter(p => p.mutable);
    if (mutableParams.length === 0) {
      paramRows.innerHTML = '<div style="color:#555;padding:4px 0">No mutable parameters</div>';
      return;
    }
    for (const p of mutableParams) {
      const row = document.createElement('div');
      row.className = 'pp-row';
      row.dataset.name = p.name;

      const nameEl = document.createElement('span');
      nameEl.className = 'pp-name';
      nameEl.title = p.displayName + ' [' + p.type + ']';
      nameEl.textContent = p.name;

      const inp = document.createElement('input');
      inp.className = 'pp-input';
      inp.type = 'text';
      inp.dataset.name = p.name;
      inp.value = pending.has(p.name) ? pending.get(p.name) : String(p.value);

      const btn = document.createElement('button');
      btn.className = 'pp-apply';
      btn.textContent = 'Apply';

      const msg = document.createElement('span');
      msg.className = 'pp-msg';
      msg.id = 'pp-msg-' + p.name;

      btn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ action: 'setParam', name: p.name, value: inp.value }));
          msg.style.color = '#888';
          msg.textContent = '…';
        }
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') btn.click();
      });

      row.appendChild(nameEl);
      row.appendChild(inp);
      row.appendChild(btn);
      row.appendChild(msg);
      paramRows.appendChild(row);
    }
  }

  function handleParamAck(ack) {
    const msgEl = document.getElementById('pp-msg-' + ack.name);
    if (ack.success) {
      // Update the input to reflect confirmed new value
      const inp = paramRows.querySelector('.pp-input[data-name="' + ack.name + '"]');
      if (inp) inp.value = String(ack.newValue);
      if (msgEl) {
        msgEl.style.color = '#4f4';
        msgEl.textContent = '✓';
        setTimeout(() => { if (msgEl) msgEl.textContent = ''; }, 2000);
      }
    } else {
      if (msgEl) {
        msgEl.style.color = '#f84';
        msgEl.textContent = '✗';
        msgEl.title = ack.error || 'error';
        setTimeout(() => { if (msgEl) { msgEl.textContent = ''; msgEl.title = ''; } }, 4000);
      }
    }
  }

  // ── benchmark HUD ────────────────────────────────────────────────────────
  let bmForceOn = true;   // local shadow so the button can toggle without waiting for a round-trip

  const benchmarkHud   = document.getElementById('benchmarkHud');
  const bmChainInfo    = document.getElementById('bmChainInfo');
  const bmHudRows      = document.getElementById('bmHudRows');
  const bmTauMeasRow   = document.getElementById('bmTauMeasRow');
  const bmTauTheoRow   = document.getElementById('bmTauTheoRow');
  const btnBenchForce  = document.getElementById('btnBenchForce');
  const chkAxes        = document.getElementById('chkAxes');

  // Axes toggle — defaults off; enabled automatically on first benchmark frame.
  chkAxes.addEventListener('change', () => { showAxes = chkAxes.checked; });

  function updateBenchmarkHud(bm) {
    benchmarkHud.classList.add('active');
    bmForceOn = bm.forceOn;

    // Enable axes on first benchmark message and sync checkbox.
    if (!showAxes && bm.chainSegments !== undefined) {
      showAxes = true;
      chkAxes.checked = true;
    }

    btnBenchForce.textContent = bmForceOn ? 'Force: ON' : 'Force: OFF';
    btnBenchForce.classList.toggle('force-off', !bmForceOn);

    // Chain config block (static during run, but sent every frame for simplicity).
    if (bm.chainSegments !== undefined) {
      bmChainInfo.className = 'bm-chain';
      bmChainInfo.innerHTML =
        `chain: ${bm.chainSegments} seg × ${bm.monomersPerSegment} mon<br>` +
        `span: ${bm.chainSpanMicrons !== undefined ? bm.chainSpanMicrons.toFixed(2) : '—'} µm<br>` +
        `aeta: ${bm.viscosity !== undefined ? bm.viscosity.toFixed(2) : '—'} Pa·s`;
    }

    // Main rows: deflection in nm (protocol carries µm)
    bmHudRows.innerHTML =
      `obs: ${(bm.observedDeflection * 1000).toFixed(1)} nm<br>` +
      `exp: ${(bm.expectedDeflection * 1000).toFixed(1)} nm<br>` +
      `ratio: ${bm.ratio.toFixed(3)}<br>` +
      `step: ${bm.stepCount}`;

    // Amber rows: τ_meas and τ_theo — hidden when force on or no release active
    const showRelax = bm.tauMeas !== undefined;
    bmTauMeasRow.style.display = showRelax ? '' : 'none';
    bmTauTheoRow.style.display = showRelax ? '' : 'none';
    if (showRelax) {
      bmTauMeasRow.textContent = bm.tauMeasFrozen
        ? `τ_meas: ${bm.tauMeas.toFixed(2)} s (crossed)`
        : `τ_meas: ${bm.tauMeas.toFixed(2)} s…`;
      bmTauTheoRow.textContent = `τ_theo: ${bm.tauTheo !== undefined ? bm.tauTheo.toFixed(2) : '—'} s`;
    }
  }

  btnBenchForce.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: 'setParam', name: 'benchmarkForceOn', value: bmForceOn ? 'false' : 'true' }));
    }
  });

  setLiveState('reconnecting');
  openSocket();
}
</script>
</body>
</html>
